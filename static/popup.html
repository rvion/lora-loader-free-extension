<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LoRA Manager</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; width: 360px; font: 13px/1.35 system-ui, -apple-system, sans-serif; background: #1a1b1e; color: #e6e6e6; }
      main { padding: 12px; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #909296; margin: 14px 0 6px; }
      label { display: grid; gap: 3px; font-size: 11px; color: #909296; }
      input { width: 100%; padding: 6px 8px; border-radius: 6px; background: #25262b; color: #e6e6e6; border: 1px solid #373a40; font-size: 13px; }
      .row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
      .status { flex: 1; min-width: 0; word-break: break-word; }
      button { cursor: pointer; padding: 6px 10px; border-radius: 6px; font-size: 13px; background: #2c2e33; color: #e6e6e6; border: 1px solid #373a40; }
      button:disabled { opacity: .5; cursor: default; }
      button.primary { background: #1971c2; border-color: #1971c2; font-weight: 600; }
      button.wide { width: 100%; margin-top: 8px; }
      button.icon { background: none; border: none; color: #909296; font-size: 16px; padding: 0 6px; }
      ul { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto; }
      li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #2c2e33; }
      .item { flex: 1; min-width: 0; }
      .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .muted { color: #909296; font-size: 12px; }
      .error { color: #ff6b6b; font-size: 12px; }
      .good { color: #51cf66; }
      .restart { margin-top: 10px; }
      .restart p { margin: 6px 0 0; }
      button.danger { background: #c92a2a; border-color: #c92a2a; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="popup.js"></script>
  </body>
</html>
